# Reverse proxy con TLS para el panel Y el puente de voz. Ajustar el nombre
# de host y correr certbot --nginx despues de instalar este bloque: certbot
# reescribe este server{} a HTTPS solo (redirige el 80) y anade el
# certificado -- no hace falta tocar 'listen 443' a mano.
#
# Ola 8 (operacion), tarea "firmware a wss:// con validacion de certificado":
# el bloque /voz existe para que el firmware pueda conectar a
# wss://TU-DOMINIO/voz en vez de ws://IP:8765 en claro. Falta la mitad
# firmware (validar el certificado en el ESP32) -- eso depende de las olas
# 3-7 (bring-up del cuerpo) y queda fuera de esta ola, documentado en
# tasks.md.
server {
    listen 80;
    server_name TU-DOMINIO-O-IP;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # websocket_bridge.py escucha en 8765 (ver HOST, PORT en ese fichero).
    # Upgrade/Connection son obligatorios para que nginx no trate esto como
    # HTTP normal y cierre la conexion tras la primera respuesta -- un
    # websocket vive de la conexion persistente.
    location /voz {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Un turno de voz puede tardar mas que el timeout por defecto de
        # nginx (60s) si el STT/LLM/TTS estan lentos -- no cortar a medias.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
