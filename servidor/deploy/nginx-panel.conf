# Reverse proxy con TLS para el panel. Ajustar el nombre de host y correr
# certbot --nginx despues de instalar este bloque.
server {
    listen 80;
    server_name TU-DOMINIO-O-IP;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
