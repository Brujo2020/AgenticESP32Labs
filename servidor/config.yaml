# ============================================================
#  Asistente de voz — configuracion
#
#  Cambiar de hyperscaler = reordenar las listas de 'proveedores'.
#  Ni el firmware ni el agente se tocan.
#
#  El orden es prioridad: se usa el primero disponible y, si falla
#  en caliente, la cadena pasa automaticamente al siguiente.
# ============================================================

proveedores:
  # Bedrock (Claude Haiku) primero: Groq alucinaba a veces la sintaxis del
  # tool-call (400 tool_use_failed) y NVIDIA daba timeout seguido -- ninguno
  # de los dos es culpa de nuestro codigo, pero tumbaban la respuesta
  # completa. Bedrock corre en la misma nube que el servidor (AWS), factura
  # contra el credito gratis de la cuenta, y Claude es mucho mas confiable
  # llamando herramientas. Groq/nvidia quedan de respaldo por si Bedrock
  # tuviera un problema puntual (o si un dia se agota el credito).
  llm: [bedrock, groq, nvidia, mlx]
  # Transcribe primero: mismo credito/cuenta AWS que Bedrock y Polly, y saca
  # a Groq de la duda mientras se confirma si el problema de reconocimiento
  # era el proveedor o el audio de origen. Groq queda de respaldo (gratis,
  # rapido) y mlx-whisper local al final (sin red, sin coste).
  stt: [transcribe, groq, mlx-whisper]
  # POLLY PRIMERO: voz neuronal en espanol de verdad (Lucia, es-ES), en la
  # misma nube que ya factura Bedrock, sin depender de que el .onnx de Piper
  # este bien descargado en el servidor. Piper queda de respaldo local (sin
  # coste, sin red) por si Polly fallara o se agotara el credito. El TTS de
  # Groq es 'canopylabs/orpheus-v1-english': un modelo MONOLINGUE INGLES con
  # voz inglesa ("austin"). Dandole texto en espanol lo pronuncia con
  # fonetica inglesa -- de ahi que sonara tan mal -- por eso va ultimo.
  #
  # OJO: 'macos' NUNCA sirve de respaldo real en este servidor -- usa el
  # comando "say", que solo existe en macOS, y el servidor corre Ubuntu.
  tts: [polly, piper, groq, macos]

# ------------------------------------------------------------
#  Catalogo: todo lo soportado. Estar aqui no significa estar activo,
#  solo las listas de arriba deciden. Los que no tengan credenciales
#  se descartan solos al arrancar.
# ------------------------------------------------------------
catalogo:

  llm:
    bedrock:                  # AWS · pagado con el credito gratis de la cuenta
      backend: "bedrock"
      # Claude 3.5 Haiku llego a fin de vida en Bedrock (19 jun 2026) --
      # "ResourceNotFoundException: This model version has reached the end
      # of its life". Claude Haiku 4.5 es su sucesor con soporte completo
      # (no solo cross-region routing) en us-east-1.
      model: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
      region: "us-east-1"     # ajusta si habilitaste el modelo en otra region
      description: "AWS Bedrock (Claude Haiku 4.5) — mismo cloud que el servidor"

    groq:                     # GRATIS · https://console.groq.com
      backend: "openai-compatible"
      base_url: "https://api.groq.com/openai/v1"
      model: "llama-3.3-70b-versatile"
      api_key: "${GROQ_API_KEY}"
      description: "Groq — gratis, inferencia mas rapida, tool calling"

    nvidia:                   # GRATIS · https://build.nvidia.com
      backend: "openai-compatible"
      base_url: "https://integrate.api.nvidia.com/v1"
      model: "meta/llama-3.3-70b-instruct"
      api_key: "${NVIDIA_API_KEY}"
      # NVIDIA ha dado timeout (ReadTimeout) repetidas veces, tanto en el
      # Mac como en el servidor de AWS -- no es un problema de red local.
      # Con el timeout por defecto (60s) cada fallo de nvidia significaba
      # medio minuto de silencio en el HUD antes de caer al siguiente
      # proveedor. Se acorta para que la cadena de respaldo reaccione rapido.
      timeout: 15
      description: "NVIDIA NIM — gratis, ~40 req/min, 100+ modelos"

    mlx:                      # LOCAL · sin red, sin coste, privado
      backend: "openai-compatible"
      base_url: "http://localhost:8000/v1"
      model: "qwen3-4b-4bit"
      api_key: "no-necesaria"
      description: "oMLX local — demo edge y privada"

    cloudflare:               # https://dash.cloudflare.com (Workers AI)
      backend: "openai-compatible"
      base_url: "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/v1"
      model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      api_key: "${CF_API_TOKEN}"
      description: "Cloudflare Workers AI — edge global"

    azure:                    # Azure OpenAI
      backend: "openai-compatible"
      base_url: "https://${AZURE_OPENAI_RESOURCE}.openai.azure.com/openai/v1"
      model: "gpt-4o-mini"
      api_key: "${AZURE_OPENAI_KEY}"
      description: "Azure OpenAI — hyperscaler, cumplimiento empresarial"

    gcp:                      # Vertex AI, endpoint compatible OpenAI
      backend: "openai-compatible"
      base_url: "https://${GCP_REGION}-aiplatform.googleapis.com/v1/projects/${GCP_PROJECT}/locations/${GCP_REGION}/endpoints/openapi"
      model: "google/gemini-2.0-flash"
      api_key: "${GCP_ACCESS_TOKEN}"
      description: "Google Vertex AI"

    aws:                      # Bedrock via pasarela compatible OpenAI
      backend: "openai-compatible"
      base_url: "${AWS_BEDROCK_GATEWAY}"
      model: "anthropic.claude-3-5-sonnet-20241022-v2:0"
      api_key: "${AWS_BEARER_TOKEN_BEDROCK}"
      description: "AWS Bedrock"

    claude:
      backend: "anthropic"
      model: "claude-sonnet-4-5"
      api_key: "${ANTHROPIC_API_KEY}"
      description: "Anthropic directo — mejor razonamiento"

  stt:
    transcribe:               # AWS · mismo credito que Bedrock/Polly
      backend: "transcribe"
      region: "us-east-1"
      description: "Amazon Transcribe (streaming) — mismo cloud que Bedrock/Polly"

    groq:
      backend: "groq"
      # large-v3 (no 'turbo'). Turbo es ~2x mas rapido pero mide peor en
      # idiomas distintos del ingles, y con audio corto grabado por el
      # microfono de la placa (24 kHz, sala con ruido) la diferencia se nota:
      # una transcripcion equivocada hace que el agente conteste a otra cosa,
      # que es justo lo que parecia "el modelo dice sandeces". Un par de
      # decimas mas de latencia valen la pena si a cambio entiende bien.
      model: "whisper-large-v3"
      api_key: "${GROQ_API_KEY}"
      description: "Whisper large v3 en Groq — mas preciso en espanol"

    mlx-whisper:
      backend: "mlx-whisper"
      model: "mlx-community/whisper-small-mlx"
      description: "Whisper local en Apple Silicon — privado, sin red"

    openai:
      backend: "openai-compatible"
      base_url: "https://api.openai.com/v1"
      model: "whisper-1"
      api_key: "${OPENAI_API_KEY}"

  tts:
    polly:                    # AWS · mismo credito que Bedrock
      backend: "polly"
      voice: "Lucia"          # es-ES neuronal. Alternativas: Conchita/Enrique (standard)
      engine: "neural"
      region: "us-east-1"
      description: "AWS Polly (Lucia, es-ES neuronal) — mismo cloud que Bedrock"

    groq:                     # ULTIMO RECURSO: no habla espanol
      backend: "openai-compatible-wav"    # Groq solo devuelve WAV, nunca PCM crudo
      base_url: "https://api.groq.com/openai/v1"
      # Orpheus es MONOLINGUE INGLES (lo dice el propio nombre del modelo) y
      # "austin" es una voz inglesa. Con texto en espanol lo lee con fonetica
      # inglesa y suena fatal. Se deja por si algun dia hace falta un TTS de
      # emergencia con la clave que ya existe, pero NO debe ir primero en la
      # cadena mientras el asistente responda en espanol.
      model: "canopylabs/orpheus-v1-english"
      voice: "austin"
      api_key: "${GROQ_API_KEY}"
      description: "Groq (Orpheus) — SOLO INGLES, ultimo recurso"

    macos:
      backend: "macos"
      voice: "Monica"
      description: "Voz del sistema — sin dependencias ni coste"

    piper:
      backend: "piper"
      # Voz es_ES de calidad 'medium'. La anterior era 'carlfm-x_low', la
      # calidad MAS BAJA de la familia: bastante robotica y con mala prosodia,
      # que por un altavoz pequeno se nota mucho. 'medium' pesa ~60 MB y suena
      # claramente mejor. Si el fichero no existe, disponible() devuelve False
      # y la cadena cae sola al siguiente proveedor: no rompe nada.
      # Descarga (ver PROVEEDORES.md):
      #   https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium/es_ES-davefx-medium.onnx
      #   ...y el .onnx.json de al lado, que trae el sample_rate del modelo.
      model_path: "/home/ubuntu/piper-voces/es_ES-davefx-medium.onnx"
      description: "Neuronal local en espanol (Piper) — TTS principal"

    openai:
      backend: "openai-compatible"
      base_url: "https://api.openai.com/v1"
      model: "tts-1"
      voice: "nova"
      api_key: "${OPENAI_API_KEY}"

# ------------------------------------------------------------
#  MCP: cada herramienta es un proceso aparte. Anadir una capacidad
#  es anadir una entrada aqui, sin tocar el agente ni el firmware.
# ------------------------------------------------------------
mcp_servers:
  clima:
    type: "subprocess"
    command: ["python3", "mcps/clima.py"]
    env: { PYTHONPATH: "." }

  sistema:
    type: "subprocess"
    command: ["python3", "mcps/sistema.py"]
    env: { PYTHONPATH: "." }

  mac:
    type: "subprocess"
    command: ["python3", "mcps/mac.py"]
    env: { PYTHONPATH: "." }

  blender:
    type: "subprocess"
    command: ["uvx", "blender-mcp"]

  unity:
    type: "subprocess"
    command: ["npx", "-y", "@coplaydev/unity-mcp"]

  # --- MCP oficiales, se descargan al vuelo con npx ---
  ficheros:
    type: "subprocess"
    command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/Users/mramospe/Documentos"]

  memoria:
    type: "subprocess"
    command: ["npx", "-y", "@modelcontextprotocol/server-memory"]

  busqueda:
    type: "subprocess"
    command: ["npx", "-y", "@modelcontextprotocol/server-brave-search"]
    env: { BRAVE_API_KEY: "${BRAVE_API_KEY}" }

  # --- El ESP32 como herramienta (ver mcp_catalogo.yaml y PROTOCOLO.md) ---
  # Faltaban aqui aunque ya estaban en tools_to_enable: activarlas fallaba
  # con "esta en tools_to_enable pero no en mcp_servers".
  dispositivo:
    type: "subprocess"
    command: ["python3", "mcps/dispositivo.py"]
    env: { HUD_BRIDGE: "ws://127.0.0.1:8765" }

  vigia:
    type: "subprocess"
    command: ["python3", "mcps/vigia.py"]
    env: { HUD_BRIDGE: "ws://127.0.0.1:8765", VIGIA_REPO: "${VIGIA_REPO}" }

  consulta:
    type: "subprocess"
    command: ["python3", "mcps/consulta.py"]
    env: { PYTHONPATH: "." }

tools_to_enable:
  - clima
  - sistema
  - mac
  - dispositivo
  - vigia
  - consulta
  # - blender      # requiere el addon BlenderMCP instalado en Blender
  # - unity        # requiere el paquete Unity MCP en el proyecto
  # - ficheros
  # - memoria
  # - busqueda

websocket:
  host: "0.0.0.0"
  port: 8765
  sample_rate: 24000

logging:
  level: "INFO"
