# Rotacion de logs (ola 8, operacion/tasks.md item 6).
#
# agentic-voz y agentic-panel no escriben a archivo: van a journald (la
# salida de logging.basicConfig/uvicorn cae a stdout, systemd la captura).
# Sin limite, journald puede crecer sin tope en un proceso 24/7 -- este
# drop-in le pone techo SOLO al journal persistente, no afecta a otros logs
# del sistema.
#
# Instalar:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald-agentic.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald
#
# Verificar:
#   journalctl --disk-usage
[Journal]
SystemMaxUse=200M
SystemKeepFree=500M
MaxRetentionSec=30day
